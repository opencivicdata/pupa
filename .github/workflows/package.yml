name: Test and build Python package

on:
  push:
    branches: [ master ]
    tags:
      - v*
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: test
          POSTGRES_DB: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
        django-series: ['4.2', '5.2', '6.0', '6.1']
        exclude:
          - django-series: '4.2'
            python-version: '3.13'
          - django-series: '4.2'
            python-version: '3.14'
          - django-series: '4.2'
            python-version: '3.15'
          - django-series: '5.2'
            python-version: '3.15'
          - django-series: '6.0'
            python-version: '3.10'
          - django-series: '6.0'
            python-version: '3.11'
          - django-series: '6.0'
            python-version: '3.15'
          - django-series: '6.1'
            python-version: '3.10'
          - django-series: '6.1'
            python-version: '3.11'
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y gdal-bin
        # TODO: Drop the opencivicdata URL once it publishes a release with Django 6 support
        pip install .[dev] "Django~=${{ matrix.django-series }}.0" \
          "opencivicdata @ git+https://github.com/opencivicdata/python-opencivicdata.git@feature/django6-support"
    - name: Lint with flake8
      run: |
        flake8 pupa
    - name: Test with pytest
      run: |
        ./run-tests.sh
    - name: Calculate test coverage
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        coveralls --service=github

  build:
    needs: test
    name: Build package and upload to PyPI
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build and publish
      if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
      run: |
        pip install build twine
        python -m build
        twine upload dist/*
      continue-on-error: true
