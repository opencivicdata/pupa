[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pupa"
dynamic = ["version"]
description = "scraping framework for muncipal data"
authors = [{ name = "James Turk", email = "james@openstates.org" }]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "Django>=4.2,<6.2",
    # TODO: Require the opencivicdata release that includes Django 6 support
    # (opencivicdata/python-opencivicdata#157) once it is published
    "opencivicdata>=3.4.0",
    "dj_database_url>=0.3.0",
    "scrapelib>=1.0",
    "jsonschema>=3.0.0",
    "psycopg2-binary",
    "pytz",
]

[project.optional-dependencies]
dev = [
    "mock",
    "pytest>=3.6",
    "pytest-cov",
    "pytest-django",
    "freezegun",
    "coveralls",
    "flake8",
]

[project.urls]
Homepage = "https://github.com/opencivicdata/pupa/"

[project.scripts]
pupa = "pupa.cli.__main__:main"

[tool.setuptools]
zip-safe = false

[tool.setuptools.dynamic]
version = { attr = "pupa.__version__" }

[tool.setuptools.packages.find]
include = ["pupa*"]
