[tox]
envlist = py{310,311,312}-django42,py{310,311,312,313,314}-django52,py{312,313,314}-django60,py{312,313,314,315}-django61,flake8
[testenv]
deps = 
    django42: Django~=4.2.0
    django52: Django~=5.2.0
    django60: Django~=6.0.0
    django61: Django~=6.1.0
commands = 
 pip install -e .[dev] git+https://github.com/opencivicdata/python-opencivicdata.git@feature/django6-support#egg=opencivicdata
 pytest pupa --ds=pupa.tests.django_settings

[testenv:flake8]
deps = flake8
commands = flake8 pupa
